[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-bench"
version = "1.0.0"
description = "10-Second CPU, Memory & Disk I/O Micro-Benchmark CLI"
readme = "README.md"
authors = [
  { name = "Moch. Erik Irriansyah", email = "erik@narotama.ac.id" }
]
license = { text = "MIT" }
keywords = ["benchmark", "cpu", "ram", "disk", "sbc", "armbian", "raspberry-pi", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Benchmark",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
soc-bench = "soc_bench.cli:main"

[project.urls]
Homepage = "https://github.com/MochErik/soc-bench"
Repository = "https://github.com/MochErik/soc-bench.git"
Issues = "https://github.com/MochErik/soc-bench/issues"
